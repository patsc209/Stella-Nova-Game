<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=game.html" />
    <title>Redirecting to Stella Nova TV…</title>
    <script>
      // Keep old orbit.html bookmarks working — one TV link now.
      const q = window.location.search || "";
      const params = new URLSearchParams(q);
      if (!params.get("mode")) params.set("mode", "orbit");
      window.location.replace("game.html?" + params.toString());
    </script>
  </head>
  <body>
    <p>Orbit Rally now lives on the main TV page. Redirecting…</p>
  </body>
</html>
