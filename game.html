<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stella Nova — TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="js/hands.js"></script>
  </head>
  <body class="game-body">
    <div id="game-root"></div>
    <div id="status">Starting TV…</div>

    <div id="lobby-overlay" class="overlay visible">
      <div class="overlay-card">
        <h1 id="tv-game-title">Stella Nova</h1>
        <p>One TV link for every world — the game switches when you pick a planet on the tablet.</p>
        <div class="room-code" id="room-code-display">····</div>
        <p class="overlay-note" id="tv-game-note">
          Open the tablet, pick a planet, then enter this room code.
          <br />
          Waiting for tablet…
        </p>
      </div>
    </div>

    <div id="paused-overlay" class="overlay">
      <div class="overlay-card">
        <h1>Paused</h1>
        <p>Take a break — resume from the tablet when you’re ready.</p>
      </div>
    </div>

    <script src="js/sync.js"></script>
    <script src="js/tv.js"></script>
  </body>
</html>
